# Project flow. This file is project-owned: Roclec seeds it once and refreshes never overwrite it.
# It is agreed with the user as the `process` reference; change it only with their approval.
# `roclec views --write` generates the readable view (default docs/flow.md) from it.
#
# Every stage is mandatory. Checkpoints are required on foundation, approve and design, optional on
# implement, integrate and release, and not allowed elsewhere. To add an optional hook, e.g. before
# implementing, add to [stages.implement]:
#   checkpoint = { decider = "owner", criteria = [], on_reject = "revise" }
# (implement = pre-implement, integrate = pre-integrate, release = handoff).
# A handoff checkpoint (release) must use on_reject = "defer". Every decision at a checkpoint is recorded
# with --criteria FILE: the person's own evaluation (met, not-met or n/a with a reason) of exactly the
# criteria listed in that checkpoint; agents never fill it in.
#
# session_evidence = "required" (allowed only with ai = true) makes the gate that closes the stage demand
# at least one imported agent session citing it: `roclec evidence record --kind agent-session --file
# META.json --transcript EXPORT`. Set it to "optional" (the default) to stop demanding sessions there.
schema = 1
view = "docs/flow.md"

[roles.owner]
kind = "human"
description = "Person who agrees references, approves intent and accepts prototypes."

# Foundation: every reference agreement (flow, constitution, ADRs, knowledge skills).
[criteria.CR-001]
text = "The reference states only what the owner decided; nothing was assumed by the agent."

[criteria.CR-002]
text = "The reference is consistent with the business context, functional scope and user stories of the product."

[criteria.CR-003]
text = "The reference does not contradict any reference already agreed."

# Approve: the proposal of each change.
[criteria.CR-004]
text = "Each origin criterion is mapped to ACs that actually satisfy it; every exclusion or deferral has a reason the owner accepts."

[criteria.CR-005]
text = "The proposal states observable behavior without ambiguity, including limits and error cases."

[criteria.CR-006]
text = "Every AC names how it will be verified (unit test, e2e test or declared manual check)."

[criteria.CR-007]
text = "Gaps in the origin (missing states, limits, country differences) are resolved as derived ACs or as answers from the owner; none is silently assumed."

[criteria.CR-008]
text = "The proposal cites every agreed ADR it depends on; any new architecture decision it needs is raised as a proposed ADR, not decided inside the proposal."

# Design: the prototype of each user-facing change.
[criteria.CR-009]
text = "The prototype demonstrates every user-facing AC of the approved proposal and adds no behavior it does not state."

[criteria.CR-010]
text = "The prototype shows the screen with Colombia's and with Chile's content."

# Pre-implement: the plan and tasks before any code is written.
[criteria.CR-011]
text = "Plan and tasks cover every AC, stay within the component's paths and follow the agreed ADRs."

# Pre-integrate: the reviewed candidate before it lands.
[criteria.CR-012]
text = "Review findings are resolved or decided by the owner, and all checks pass."

[stages.foundation]
description = "Agree the project references (constitution, ADRs, process) before changes depend on them."
ai = true
session_evidence = "optional"
role = "coordinator"
checkpoint = { decider = "owner", criteria = ["CR-001", "CR-002", "CR-003"], on_reject = "revise" }

[stages.define]
description = "Capture discovery and draft the capability/change bundle with sources and acceptance criteria."
ai = true
session_evidence = "optional"
role = "specifier"
skills = ["story-spec"]

[stages.approve]
description = "Approve the exact intent of the change; approval freezes its digest."
ai = false
reason = "Only a person decides which intent is accepted."
role = "owner"
checkpoint = { decider = "owner", criteria = ["CR-004", "CR-005", "CR-006", "CR-007", "CR-008"], on_reject = "revise" }

[stages.design]
description = "Produce and review user-facing design or prototypes before implementation."
ai = true
session_evidence = "optional"
role = "coordinator"
checkpoint = { decider = "owner", criteria = ["CR-009", "CR-010"], on_reject = "revise" }

[stages.plan]
description = "Assign the approved change to a release and plan the implementation work."
ai = true
session_evidence = "optional"
role = "implementer"
skills = ["country-content"]

[stages.implement]
description = "Implement the approved change within its declared scope."
ai = true
session_evidence = "optional"
role = "implementer"
checkpoint = { decider = "owner", criteria = ["CR-011"], on_reject = "revise" }
skills = ["country-content"]

[stages.verify]
description = "Run the configured checks and record evidence covering the acceptance criteria."
ai = true
session_evidence = "optional"
role = "implementer"

[stages.review]
description = "Independent review of the candidate; findings stay open until resolved or decided."
ai = true
session_evidence = "optional"
role = "reviewer"
skills = ["country-content"]

[stages.integrate]
description = "Integrate the verified, reviewed candidate per component."
ai = true
session_evidence = "optional"
role = "coordinator"
checkpoint = { decider = "owner", criteria = ["CR-012"], on_reject = "revise" }

[stages.release]
description = "Verify the combined release, prepare it and record the existing Git publication."
ai = true
session_evidence = "optional"
role = "coordinator"
