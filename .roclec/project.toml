schema = 3
name = "Car insurance"
trunk_ref = "refs/heads/main"
secret_env = ["APP_KEYS", "API_TOKEN_SALT", "ADMIN_JWT_SECRET", "TRANSFER_TOKEN_SALT", "JWT_SECRET", "ENCRYPTION_KEY", "STRAPI_API_TOKEN"]
redact_patterns = ["eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}", "[0-9a-f]{128,}", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"]

[sessions]
storage = "versioned-redacted"

[components.app]
repo = "."
target_ref = "refs/remotes/origin/main"
user_facing = true
inputs = [
  "apps/web/src/**", "apps/web/public/**", "apps/web/package.json", "apps/web/package-lock.json",
  "apps/web/angular.json", "apps/web/tsconfig*.json",
  "apps/cms/src/**", "apps/cms/config/**", "apps/cms/database/**", "apps/cms/types/**", "apps/cms/scripts/**",
  "apps/cms/package.json", "apps/cms/package-lock.json", "apps/cms/tsconfig*.json", "apps/cms/.env.example",
  "e2e/tests/**", "e2e/package.json", "e2e/package-lock.json", "e2e/playwright.config.ts",
  "docker-compose.yml", ".env.example",
  "packages/shared/src/**", "packages/shared/package.json", "packages/shared/tsconfig*.json",
  "packages/shared/vitest.config.ts", "packages/shared/eslint.config.js", "package-lock.json",
  "apps/cms/Dockerfile", "apps/web/Dockerfile", "apps/web/nginx.conf", ".dockerignore", "apps/web/.postcssrc.json",
  "apps/web/eslint.config.js", "apps/cms/eslint.config.mjs", "apps/cms/vitest.config.ts", "e2e/eslint.config.js",
  "e2e/tsconfig.json", "package.json", ".nvmrc", ".prettierrc.json", ".prettierignore", ".editorconfig",
  "apps/cms/favicon.png", "apps/cms/public/robots.txt",
]
generated = [
  "*node_modules/*", "apps/web/dist/**", "apps/web/.angular/**", "packages/shared/dist/**",
  "apps/cms/dist/**", "apps/cms/build/**", "apps/cms/.strapi/**", "apps/cms/.tmp/**", "apps/cms/public/uploads/**",
  "e2e/test-results/**", "e2e/playwright-report/**",
  "apps/*/coverage/**", "packages/shared/coverage/**", "apps/cms/data/**", "apps/cms/.strapi-updater.json",
]
excluded = [
  ".venv/*", ".idea/*", "*.DS_Store", ".env", "apps/*/.env",
  ".claude/*", ".codex/*", ".agents/skills/roclec-*", "AGENTS.md", "CLAUDE.md",
  "README.md", "FLOW.md", "docs/assessment/*", "docs/pilot/*", "apps/*/.gitignore", "apps/*/README.md",
  ".agents/skills/angular-developer/*", ".agents/skills/design-lab/*",
  ".agents/skills/design-taste-frontend/*", ".agents/skills/frontend-design/*",
  ".agents/skills/impeccable/*", ".agents/skills/strapi-docs-mcp/*",
  ".agents/skills/ui-ux-pro-max/*", ".agents/skills/web-design-guidelines/*",
  "skills-lock.json", ".gitattributes", "docs/plans/**", "docs/prototypes/**",
]
verification = [
  {id = "format", argv = ["npm", "run", "format:check"], cwd = ".", timeout_seconds = 300},
  {id = "lint", argv = ["npm", "run", "lint"], cwd = ".", timeout_seconds = 600},
  {id = "shared-unit", argv = ["npm", "run", "test:ci"], cwd = "packages/shared", timeout_seconds = 600, acceptance_ids = ["AC-036", "AC-040", "AC-041", "AC-044", "AC-046", "AC-053"]},
  {id = "web-unit", argv = ["npm", "run", "test:ci"], cwd = "apps/web", timeout_seconds = 600, acceptance_ids = ["AC-036", "AC-037", "AC-038", "AC-040", "AC-041", "AC-042", "AC-044", "AC-045", "AC-046", "AC-047", "AC-048", "AC-049", "AC-050", "AC-051", "AC-052", "AC-053", "AC-054", "AC-055", "AC-056", "AC-057", "AC-058", "AC-059", "AC-060"]},
  {id = "cms-unit", argv = ["npm", "run", "test:ci"], cwd = "apps/cms", timeout_seconds = 600, acceptance_ids = ["AC-043", "AC-045", "AC-046", "AC-064", "AC-065", "AC-066"]},
  {id = "web-build", argv = ["npm", "run", "build"], cwd = "apps/web", timeout_seconds = 600},
  {id = "cms-build", argv = ["npm", "run", "build"], cwd = "apps/cms", timeout_seconds = 600},
  {id = "e2e", argv = ["sh", "-c", "docker compose down -v && docker compose up -d --build --wait && npm run test:e2e"], cwd = ".", timeout_seconds = 2400, acceptance_ids = ["AC-036", "AC-037", "AC-038", "AC-039", "AC-042", "AC-045", "AC-046", "AC-047", "AC-048", "AC-050", "AC-051", "AC-053", "AC-054", "AC-056", "AC-057", "AC-058", "AC-059", "AC-060", "AC-062", "AC-064", "AC-065", "AC-066"]},
]
